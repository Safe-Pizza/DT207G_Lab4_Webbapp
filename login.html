<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DT207G - Lab4 - Webbapp</title>
</head>

<body>

    <header>
        <h1>Lab4</h1>
    </header>
    <div class="container-navigation">
        <div class="container-hamburger">
            <div id="hamburger-menu">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="./index.html">Startsida</a></li>
                <li class="current-page"><a href="./login">Logga in</a></li>
                <li><a href="./admin">Admin</a></li>
            </ul>
        </nav>
    </div>
    <main>
        <h2>Logga in</h2>
        <ul id="errors" class="error">

        </ul>

        <div id="form-login" class="form">
            <label for="username">Användarnamn: </label><br>
            <input type="text" id="username"><br>

            <label for="password">Lösenord: </label><br>
            <input type="password" id="password"><br>

            <button id="submit-button">Logga in</button>

            <div class="separator"></div>
            <p>Saknar du konto? <a href="#form-register" class="link-register">Registrera dig här</a></p>

        </div>
        <div class="separator"></div>
        <ul id="errors-reg" class="error">

        </ul>
        <div id="form-register" class="form hidden">
            <label for="reg-username">Användarnamn: </label><br>
            <input type="text" id="reg-username"><br>

            <label for="reg-password">Lösenord: </label><br>
            <input type="password" id="reg-password"><br>

            <label for="reg-confirm-password">Upprepa lösenord: </label><br>
            <input type="password" id="reg-confirm-password"><br>

            <button id="register-button">Registrera</button>
        </div>
    </main>
</body>
